name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["master"]

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: consens-lock-server
      - run: npm run lint
        working-directory: consens-lock-server
      - run: npm test
        working-directory: consens-lock-server

  npm-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: consens-lock-npm-client
      - run: npm run lint
        working-directory: consens-lock-npm-client
      - run: npm test
        working-directory: consens-lock-npm-client
